  <style>

    /* =====================================================
       RESET
    ===================================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {

    }

    body {

        Arial,
        sans-serif;

      background: #061806;
      color: #ffffff;
      overflow-x: hidden;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;

      width: 100%;

      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding:
        max(42px, env(safe-area-inset-top))
        24px
        max(42px, env(safe-area-inset-bottom));

      isolation: isolate;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(80, 205, 80, 0.22) 0%,
          rgba(50, 150, 50, 0.10) 32%,
          transparent 62%
        ),
        linear-gradient(
          145deg,
          #071907 0%,
          #123d12 25%,
          #329632 52%,
          #145014 76%,
          #061606 100%
        );
    }


    /* =====================================================
       SILK BACKGROUND
    ===================================================== */

    .silk {
      position: absolute;

      inset: -15%;

      width: 130%;
      height: 130%;

      pointer-events: none;

      z-index: -4;

      opacity: 0.96;

      filter: blur(1px);

      animation:
        silkMove 14s ease-in-out infinite alternate;
    }


    @keyframes silkMove {

      0% {
        transform:
          translate3d(-2%, -1%, 0)
          scale(1.03);
      }

      100% {
        transform:
          translate3d(2%, 1.5%, 0)
          scale(1.07);
      }

    }


    /* =====================================================
       VIGNETTE
    ===================================================== */

    .vignette {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: -2;

      background:
        radial-gradient(
          ellipse at center,
          transparent 32%,
          rgba(0, 0, 0, 0.18) 63%,
          rgba(0, 0, 0, 0.52) 100%
        );
    }


    /* =====================================================
       CENTER GLOW
    ===================================================== */

    .center-glow {
      position: absolute;

      width: 720px;
      height: 720px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(130, 255, 130, 0.15),
          rgba(50, 150, 50, 0.05) 42%,
          transparent 72%
        );

      filter: blur(35px);

      z-index: -3;

      pointer-events: none;
    }


    /* =====================================================
       STARS
    ===================================================== */

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 0 7px #ffffff,
        0 0 16px rgba(255, 255, 255, 0.8);

      opacity: 0.75;

      pointer-events: none;

      animation:
        starPulse 3s ease-in-out infinite;
    }


    .star::before,
    .star::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }


    .star::before {
      width: 1px;
      height: 34px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(255,255,255,0.9),
          transparent
        );
    }


    .star::after {
      width: 34px;
      height: 1px;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(255,255,255,0.9),
          transparent
        );
    }


    .star-1 {
      top: 13%;
      left: 12%;
      animation-delay: 0s;
    }

    .star-2 {
      top: 22%;
      right: 13%;
      animation-delay: 1.1s;
    }

    .star-3 {
      bottom: 18%;
      left: 14%;
      animation-delay: 1.8s;
    }

    .star-4 {
      bottom: 13%;
      right: 13%;
      animation-delay: 0.6s;
    }


    @keyframes starPulse {

      0%,
      100% {
        opacity: 0.25;

        transform:
          scale(0.75)
          rotate(0deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.2)
          rotate(12deg);
      }

    }


    /* =====================================================
       GLASS CONTENT PANEL
    ===================================================== */

    .content {
      position: relative;

      z-index: 5;

      width: min(100%, 650px);

      padding:
        54px
        54px
        50px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      background:
        linear-gradient(
          145deg,
          rgba(10, 55, 16, 0.42),
          rgba(4, 31, 9, 0.28)
        );

      border:
        1px solid rgba(255, 255, 255, 0.20);

      border-radius: 32px;

      backdrop-filter:
        blur(16px)
        saturate(115%);

      -webkit-backdrop-filter:
        blur(16px)
        saturate(115%);

      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.24),
        0 8px 28px rgba(0, 0, 0, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);

      overflow: hidden;
    }


    /* Glass highlight */

    .content::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      border-radius: inherit;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0.025) 30%,
          transparent 55%
        );
    }


    /* Soft glow */

    .content::after {
      content: "";

      position: absolute;

      z-index: -1;

      width: 70%;
      height: 70px;

      left: 15%;
      bottom: -40px;

      background:
        rgba(83, 255, 83, 0.20);

      filter: blur(45px);

      pointer-events: none;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    .title {

    .percentage {

    /* =====================================================

      line-height: 1.5;

      font-weight: 600;

      letter-spacing: 0.06em;

      color:

      margin-bottom: 28px;

      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.28);
    }


    /* =====================================================
       DIVIDER
    ===================================================== */

    .divider {

      height: 1px;

    ===================================================== */

    .buttons {

      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 14px;
    }


    .btn {

      min-height: 62px;

      display: inline-flex;

      align-items: center;

      text-decoration: none;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: 0.035em;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
